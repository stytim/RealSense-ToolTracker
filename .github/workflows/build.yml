name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-2022
            label: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------------------------------------------------------------------
      # Linux: Intel apt repo for librealsense, plus OpenCV + GLFW system deps.
      # -------------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release \
            build-essential cmake ninja-build pkg-config \
            libopencv-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev \
            libusb-1.0-0-dev libudev-dev

          # Intel RealSense apt repo. The .pgp file Intel hosts on their CDN
          # is currently stale relative to the key that actually signs the apt
          # InRelease metadata (apt logs "NO_PUBKEY FB0B24895113F120"), so we
          # fetch the signing key directly from Ubuntu's keyserver over HTTP
          # and dearmor it. (HTTP avoids needing dirmngr + /root/.gnupg, both
          # of which were missing on the runner.)
          # If this ever stops working, run `apt-get update` against the repo
          # locally to find the current key ID and update the fingerprint below.
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xFB0B24895113F120&options=mr" \
            | sudo gpg --dearmor -o /etc/apt/keyrings/librealsense.gpg
          sudo chmod 0644 /etc/apt/keyrings/librealsense.gpg
          echo "deb [signed-by=/etc/apt/keyrings/librealsense.gpg] https://librealsense.intel.com/Debian/apt-repo $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/librealsense.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librealsense2-dev librealsense2-utils

      # -------------------------------------------------------------------
      # macOS (both x86_64 and arm64): Homebrew handles everything.
      # librealsense's arm64 brew bottle has been bumpy historically; if it
      # breaks here, the most likely cause is upstream brew formula state.
      # -------------------------------------------------------------------
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          brew update
          brew install cmake ninja opencv librealsense

      # -------------------------------------------------------------------
      # Windows: Chocolatey for OpenCV, official Intel installer for the
      # RealSense SDK. The SDK installer drops files at the exact path the
      # current CMakeLists hardcodes, so no extra wiring is required.
      # -------------------------------------------------------------------
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Installing OpenCV via chocolatey..."
          choco install opencv --version=4.10.0 -y --no-progress
          # chocolatey installs to C:\tools\opencv\build by default
          $opencvDir = "C:\tools\opencv\build"
          if (-not (Test-Path "$opencvDir\OpenCVConfig.cmake")) {
            # OpenCV >=4 nests the config under build\x64\vc16\lib
            $opencvDir = Get-ChildItem -Path "C:\tools\opencv" -Recurse -Filter "OpenCVConfig.cmake" | Select-Object -First 1 -ExpandProperty Directory | Select-Object -ExpandProperty FullName
          }
          Write-Host "Resolved OpenCV_DIR=$opencvDir"
          "OpenCV_DIR=$opencvDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$opencvDir\x64\vc16\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

          Write-Host "Downloading Intel RealSense SDK installer..."
          # Bump these together when realsenseai cuts a new SDK release.
          # The filename format ("RealSense.SDK-WIN10-X.Y.Z.B.exe") changes
          # release-to-release; check the latest at
          # https://github.com/realsenseai/librealsense/releases/latest
          $rsTag = "v2.57.7"
          $rsBuild = "2.57.7.10378"
          $rsUrl = "https://github.com/realsenseai/librealsense/releases/download/$rsTag/RealSense.SDK-WIN10-$rsBuild.exe"
          $installer = "$env:RUNNER_TEMP\rs-installer.exe"
          Invoke-WebRequest -Uri $rsUrl -OutFile $installer
          Write-Host "Installer size: $([math]::Round((Get-Item $installer).Length / 1MB, 2)) MB"

          $installPath = "C:\Program Files (x86)\Intel RealSense SDK 2.0"
          $expectedLib = "$installPath\lib\x64\realsense2.lib"

          # The Windows installer packaging has changed between librealsense
          # releases (InnoSetup -> NSIS -> InstallShield depending on the
          # version), so try the common silent conventions in order and stop
          # as soon as the expected library appears.
          $flagSets = @(
            @('/S'),
            @('/silent'),
            @('/quiet'),
            @('/s'),
            @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-')
          )
          foreach ($flags in $flagSets) {
            if (Test-Path $expectedLib) { break }
            Write-Host "Silent install attempt: $($flags -join ' ')"
            $proc = Start-Process -FilePath $installer -ArgumentList $flags -Wait -PassThru
            Write-Host "  exit code: $($proc.ExitCode)"
            # Some installer wrappers exit before the real install finishes;
            # poll the expected library path briefly.
            for ($i = 0; $i -lt 30; $i++) {
              if (Test-Path $expectedLib) { break }
              Start-Sleep -Seconds 1
            }
          }

          if (-not (Test-Path $expectedLib)) {
            Write-Host '---- Diagnostics ----'
            if (Test-Path $installPath) {
              Write-Host "$installPath contents:"
              Get-ChildItem -Path $installPath -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName
            } else {
              Write-Host "$installPath does not exist."
            }
            Write-Host 'Searching C: for realsense2.lib (slow, last resort)...'
            Get-ChildItem -Path 'C:\' -Filter realsense2.lib -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "RealSense SDK install did not produce $expectedLib."
          }
          Write-Host "RealSense SDK installed at $installPath."

      # -------------------------------------------------------------------
      # Configure + build. Windows is pinned to the x64 VS generator so we
      # never accidentally pick up a 32-bit toolchain (the OpenCV / RealSense
      # libs we install above are x64-only). /MT linkage on Windows + prebuilt
      # OpenCV (/MD) relies on the /FORCE linker flag already set in CMakeLists.
      # -------------------------------------------------------------------
      - name: Configure (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel
